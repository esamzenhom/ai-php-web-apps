rules:
  - id: php-code-execution
    languages: [php]
    severity: ERROR
    message: Shell commands, eval and unsafe deserialization are not allowed in generated websites.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: shell_exec(...)
      - pattern: passthru(...)
      - pattern: proc_open(...)
      - pattern: popen(...)
      - pattern: unserialize(...)
  - id: php-dynamic-call
    languages: [php]
    severity: ERROR
    message: Dynamic function calls need a safer explicit allowlist implementation.
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: '^\$[A-Za-z_][A-Za-z0-9_]*$'
  - id: php-sql-injection
    languages: [php]
    severity: ERROR
    message: Untrusted input reaches a database query. Use a prepared statement with bound parameters.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sinks:
      - pattern-either:
          - pattern: $DB->query(...)
          - pattern: $DB->exec(...)
          - pattern: mysqli_query(...)
          - pattern: $DB->prepare(...)
  - id: php-xss
    languages: [php]
    severity: ERROR
    message: Untrusted input is printed without HTML escaping.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
    pattern-sinks:
      - pattern: echo ...;
  - id: php-input-file-operation
    languages: [php]
    severity: ERROR
    message: Untrusted input controls a file operation or include. Validate against an explicit safe path list.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
    pattern-sinks:
      - pattern-either:
          - pattern: include $PATH;
          - pattern: require $PATH;
          - pattern: file_get_contents(...)
          - pattern: file_put_contents(...)
          - pattern: unlink(...)
          - pattern: move_uploaded_file(...)
  - id: php-weak-password-hash
    languages: [php]
    severity: ERROR
    message: Use password_hash/password_verify for passwords; do not use MD5 or SHA1.
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
  - id: js-dangerous-execution
    languages: [javascript]
    severity: ERROR
    message: Dynamic JavaScript execution is not allowed.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)
  - id: js-dom-injection
    languages: [javascript]
    severity: ERROR
    message: Untrusted input reaches HTML. Use textContent or a reviewed sanitizer.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: location.search
          - pattern: location.hash
          - pattern: document.URL
          - pattern: $E.data
    pattern-sinks:
      - pattern-either:
          - pattern: $EL.innerHTML = $VALUE
          - pattern: document.write(...)
  - id: embedded-executable-markup
    languages: [generic]
    severity: ERROR
    message: Inline event handlers, javascript URLs, embedded scripts in HTML/SVG and encoded PHP execution must be replaced with reviewed external code.
    paths:
      include: ["*.html", "*.svg", "*.php"]
    pattern-regex: '(?is)(<[a-z][^>]*(?:\s|/)on[a-z]+\s*=|javascript\s*:|<script\b(?![^>]*\bsrc\s*=)|<foreignObject\b|\beval\s*\(|\bassert\s*\(|\bbase64_decode\s*\()'
